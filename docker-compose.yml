# self-docs local stack (PRD 2).
#
#   docker compose up --build
#
# Then open http://localhost:8080 (frontend serves the SPA and proxies /api).
# Copy .env.example to .env to override defaults.
#
# Redis is optional; enable it with:  docker compose --profile cache up --build

name: self-docs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selfdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfdocs}
      POSTGRES_DB: ${POSTGRES_DB:-selfdocs}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selfdocs} -d ${POSTGRES_DB:-selfdocs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed only for local inspection; remove in production.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-selfdocs}:${POSTGRES_PASSWORD:-selfdocs}@db:5432/${POSTGRES_DB:-selfdocs}?sslmode=disable
      PORT: "8080"
      MASTER_PASSWORD_HASH: ${MASTER_PASSWORD_HASH:-}
      REDIS_URL: ${REDIS_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GIN_MODE: release
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

  # Optional cache (PRD 2, 5). Enable with `--profile cache`.
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
