server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using a variable in proxy_pass defers resolution
    # to request time, so nginx starts even if the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8080";

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted assets produced by Vite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API + health to the backend service (same-origin for the SPA).
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass $backend/healthz;
        proxy_set_header Host $host;
    }

    # SPA fallback: unknown routes serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
